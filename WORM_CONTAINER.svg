<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes glow-pulse {
        0%, 100% { filter: drop-shadow(0 0 6px #00ff00); }
        50% { filter: drop-shadow(0 0 15px #00ff00); }
      }
      @keyframes flow-right {
        0% { transform: translateX(-20px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(20px); opacity: 0; }
      }
      @keyframes seal-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .header-text { font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold; fill: #00ff00; letter-spacing: 1px; }
      .subheader { font-family: 'Courier New', monospace; font-size: 14px; fill: #ffaa00; letter-spacing: 3px; }
      .math-text { font-family: 'Courier New', monospace; font-size: 13px; fill: #88ccff; }
      .label-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #cccccc; }
      .flow-symbol { animation: flow-right 4s infinite; font-family: 'Courier New', monospace; font-size: 16px; fill: #00ffff; }
      .seal { animation: seal-spin 20s linear infinite; }
      .glow-element { filter: drop-shadow(0 0 8px #00ff00); }
      .pink-glow { filter: drop-shadow(0 0 8px #ff00ff); }
      .gold-glow { filter: drop-shadow(0 0 10px #ffaa00); }
    </style>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1400" height="900" fill="#0a0f2e"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1a3a4a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#grid)"/>

  <!-- Top header -->
  <text x="60" y="55" class="header-text">ISOMORPHIC SHIFT // WORM CONTAINER</text>
  <text x="1340" y="55" class="subheader" text-anchor="end">REVERSIBLE · UNICODED · SEALED</text>

  <!-- Outer container border -->
  <rect x="120" y="110" width="1160" height="600" fill="none" stroke="#00ffff" stroke-width="3" rx="15"/>
  <rect x="125" y="115" width="1150" height="590" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="10,10" rx="15" opacity="0.5"/>

  <!-- Left bind circle (A) - cyan -->
  <circle cx="240" cy="410" r="75" fill="none" stroke="#00ffff" stroke-width="2" class="glow-element"/>
  <circle cx="240" cy="410" r="70" fill="none" stroke="#00ffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  <circle cx="240" cy="410" r="12" fill="#00ffff" class="glow-element"/>
  <text x="240" y="425" class="label-text" text-anchor="middle" font-size="9">A</text>

  <!-- Right bind circle (B) - magenta/gold -->
  <circle cx="1160" cy="410" r="75" fill="none" stroke="#ff00ff" stroke-width="2" class="pink-glow"/>
  <circle cx="1160" cy="410" r="70" fill="none" stroke="#ffaa00" stroke-width="1" stroke-dasharray="5,5" opacity="0.7"/>
  <circle cx="1160" cy="410" r="12" fill="#ff00ff" class="pink-glow"/>
  <text x="1160" y="425" class="label-text" text-anchor="middle" font-size="9">B</text>

  <!-- Flowing symbols across top -->
  <g id="flow-symbols">
    <text x="100" y="180" class="flow-symbol" style="animation-delay: 0s;">∘</text>
    <text x="150" y="180" class="flow-symbol" style="animation-delay: 0.3s;">↑</text>
    <text x="200" y="180" class="flow-symbol" style="animation-delay: 0.6s;">⟂</text>
    <text x="250" y="180" class="flow-symbol" style="animation-delay: 0.9s;">Ω</text>
    <text x="300" y="180" class="flow-symbol" style="animation-delay: 1.2s;">∴</text>
    <text x="350" y="180" class="flow-symbol" style="animation-delay: 1.5s;">∩</text>
    <text x="400" y="180" class="flow-symbol" style="animation-delay: 1.8s;">φ</text>
    <text x="450" y="180" class="flow-symbol" style="animation-delay: 2.1s;">Σ</text>
    <text x="500" y="180" class="flow-symbol" style="animation-delay: 2.4s;">◇</text>
    <text x="550" y="180" class="flow-symbol" style="animation-delay: 2.7s;">∧</text>
    <text x="600" y="180" class="flow-symbol" style="animation-delay: 3s;">⊕</text>
    <text x="650" y="180" class="flow-symbol" style="animation-delay: 3.3s;">※</text>
    <text x="700" y="180" class="flow-symbol" style="animation-delay: 3.6s;">◉</text>
    <text x="750" y="180" class="flow-symbol" style="animation-delay: 3.9s;">⊗</text>
    <text x="800" y="180" class="flow-symbol" style="animation-delay: 4.2s;">✵</text>
    <text x="850" y="180" class="flow-symbol" style="animation-delay: 4.5s;">⊙</text>
  </g>

  <!-- Book/page shape in center -->
  <g transform="translate(420, 260)" filter="url(#shadow)">
    <!-- Left page -->
    <path d="M 0 0 L 140 0 L 190 40 L 190 320 L 0 320 Z" fill="#f8f8f8" stroke="#ffaa00" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 190 40 L 330 40 L 330 320 L 190 320 Z" fill="#e8e8e8" stroke="#ffaa00" stroke-width="2"/>
    <!-- Spine -->
    <line x1="190" y1="40" x2="190" y2="320" stroke="#ffaa00" stroke-width="3"/>
  </g>

  <!-- Left page text -->
  <text x="450" y="300" class="math-text" font-size="11">A ⇌ B :</text>
  <text x="450" y="325" class="math-text" font-size="11">f⁻¹(f(x)) = canon(x)</text>
  <text x="450" y="350" class="math-text" font-size="11">meaning(x) ≡ meaning(f(x))</text>
  <text x="450" y="375" class="math-text" font-size="11">ROWM ⟺ WORM</text>
  <text x="450" y="400" class="math-text" font-size="11">WRITE ONCE · READ MANY</text>

  <!-- Right page text -->
  <text x="700" y="300" class="label-text" font-size="10">SHA-512 DIGEST</text>
  <text x="700" y="325" class="label-text" font-size="10">Ed25519 VERIFY</text>
  <text x="700" y="350" class="label-text" font-size="10">MERKLE(ROOT)</text>
  <text x="700" y="375" class="label-text" font-size="10">PROLOG ⟺ DATALOG</text>
  <text x="700" y="400" class="label-text" font-size="10">SUBLEQ BYTECODE</text>

  <!-- Connection curves (animated) -->
  <path d="M 315 350 Q 600 250, 850 350" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>
  <path d="M 315 470 Q 600 570, 850 470" fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Central seal (Omega circle) - SPINNING -->
  <g transform="translate(1000, 480)" class="seal gold-glow">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffaa00" stroke-width="2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffaa00" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="0" y="8" class="header-text" text-anchor="middle" font-size="48" fill="#ffaa00">Ω</text>
  </g>

  <!-- Seal labels -->
  <text x="1000" y="600" class="label-text" text-anchor="middle" font-size="9">CRYPTOGRAPHICALLY</text>
  <text x="1000" y="615" class="label-text" text-anchor="middle" font-size="9">STAMPED</text>
  <text x="1000" y="630" class="label-text" text-anchor="middle" font-size="8">Ed25519 + SHA-512</text>

  <!-- Bottom divider -->
  <line x1="120" y1="750" x2="1280" y2="750" stroke="#00ffff" stroke-width="2" opacity="0.8"/>

  <!-- Bottom labels -->
  <text x="140" y="785" class="math-text" font-size="12">WORM ⇌ ROWM</text>
  <text x="380" y="785" class="label-text" font-size="12">WRITE ONCE · READ MANY</text>
  <text x="700" y="785" class="math-text" font-size="12">f⁻¹(f(x)) = canonical(x)</text>
  <text x="1260" y="785" class="header-text" text-anchor="end" font-size="12">EVIDENCE OR SILENCE</text>

  <!-- Bottom symbols -->
  <text x="150" y="835" class="label-text" font-size="10">∘ ↑ ⟂ Ω ∴ ∩ φ Σ ◇ ∧ ⊕ ※ ◉ ⊗ ✵ ⊙</text>
</svg>
