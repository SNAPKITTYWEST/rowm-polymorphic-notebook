<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sovereign Notebook — Verifiable computation in your browser">
    <title>Ω Isomorphic WORM Notebook</title>
    <link rel="stylesheet" href="styles/notebook.css">
    <link rel="stylesheet" href="styles/jit-box.css">
    <link rel="stylesheet" href="styles/ahmad-bot.css">
</head>
<body>
    <div id="notebook-container">
        <!-- Header -->
        <header id="notebook-header">
            <div class="header-left">
                <h1>Ω Isomorphic WORM Notebook</h1>
                <p class="subtitle">Verifiable computation in your browser</p>
            </div>
            <div class="header-controls">
                <button id="btn-run-all" class="btn btn-primary">Run All</button>
                <button id="btn-export-receipt" class="btn btn-secondary">Export Receipt</button>
                <button id="btn-settings" class="btn btn-tertiary">⚙</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="notebook-main">
            <!-- Sidebar: Metadata + Dependencies -->
            <aside id="notebook-sidebar">
                <section id="metadata-browser">
                    <h3>Notebook Metadata</h3>
                    <div id="metadata-list"></div>
                </section>
                <section id="dependency-graph">
                    <h3>Cell Dependencies</h3>
                    <svg id="dependency-svg" width="200" height="200"></svg>
                </section>
                <section id="trust-policies">
                    <h3>Trust Policies</h3>
                    <div id="trust-list"></div>
                </section>
            </aside>

            <!-- Cell Editor Area -->
            <section id="notebook-cells">
                <!-- Cells dynamically inserted here -->
            </section>

            <!-- WORM Ledger Browser -->
            <aside id="ledger-panel">
                <h3>WORM Receipt Chain</h3>
                <div id="receipt-chain-view"></div>
            </aside>
        </main>

        <!-- Footer: Status Bar -->
        <footer id="notebook-footer">
            <div id="status-text">Ready</div>
            <div id="execution-stats">0 cells | 0 ms</div>
        </footer>
    </div>


    <!-- Animation Engine (SVG Canvas) -->
    <canvas id="animation-canvas" style="display: none;"></canvas>

    <!-- WebLLM Library (Real Model Inference) - with fallback CDNs -->
    <script>
        // Initialize CDN loading with fallbacks
        window.webllmCDNLoading = true;
        window.webllmReady = false;
        window.webllmLoadTimestamp = Date.now();
        window.webllmError = null;
        window.webllmCallbacks = [];

        // Register callback to run when WebLLM finishes loading
        function onWebLLMReady(callback) {
            if (window.webllmReady) {
                callback();
            } else {
                window.webllmCallbacks.push(callback);
            }
        }

        // Fire all registered callbacks when WebLLM loads
        function fireWebLLMCallbacks() {
            console.log('WebLLM ready, firing callbacks...');
            window.webllmCallbacks.forEach(cb => {
                try { cb(); } catch(e) { console.error('Callback error:', e); }
            });
            window.webllmCallbacks = [];
        }
    </script>

    <!-- Primary CDN: jsDelivr (with extended timeout handling) -->
    <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.32/dist/web-llm.js"
            onload="window.webllmReady = true; window.webllmCDNLoading = false; console.log('WebLLM loaded from jsDelivr (' + (Date.now() - window.webllmLoadTimestamp) + 'ms)'); fireWebLLMCallbacks();"
            onerror="window.webllmError = 'jsDelivr failed'; loadWebLLMFallback();">
    </script>

    <!-- Extended timeout check and fallback trigger -->
    <script>
        // If CDN hasn't loaded after 8 seconds, try fallback
        window.cdnTimeoutHandle = setTimeout(function() {
            if (!window.webllmReady && !window.webllmError) {
                console.warn('CDN timeout (8s), trying fallback CDN...');
                window.webllmError = 'jsDelivr timeout';
                loadWebLLMFallback();
            }
        }, 8000);

        function loadWebLLMFallback() {
            if (window.webllm) {
                console.log('WebLLM already loaded');
                window.webllmReady = true;
                window.webllmCDNLoading = false;
                clearTimeout(window.cdnTimeoutHandle);
                fireWebLLMCallbacks();
                return;
            }

            console.warn('Trying fallback CDN (unpkg)...');
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/@mlc-ai/web-llm@0.2.32/dist/web-llm.js';
            script.onload = function() {
                window.webllmReady = true;
                window.webllmCDNLoading = false;
                clearTimeout(window.cdnTimeoutHandle);
                console.log('WebLLM loaded from unpkg (' + (Date.now() - window.webllmLoadTimestamp) + 'ms)');
                fireWebLLMCallbacks();
            };
            script.onerror = function() {
                window.webllmError = 'All CDNs failed (jsDelivr timeout, unpkg error)';
                window.webllmCDNLoading = false;
                clearTimeout(window.cdnTimeoutHandle);
                console.error('Failed to load WebLLM from any CDN');
                // Show error to user
                if (window.ahmadJITUI) {
                    window.ahmadJITUI.addMessage('system', 'ERROR: Failed to load WebLLM library from CDN. Check internet connection.');
                }
            };
            script.onerror();  // Trigger onerror if unpkg also fails
            document.head.appendChild(script);
        }
    </script>

    <!-- Ahmad Bot JIT Engine -->
    <script src="./js/ahmad-jit-engine.js"></script>
    <script src="./js/ahmad-jit-ui.js"></script>
</body>
</html>
