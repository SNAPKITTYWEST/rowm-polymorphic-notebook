[package]
name = "rowm-wasm-engine"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.91"
wasm-bindgen-futures = "0.4.41"
js-sys = "0.3.68"
web-sys = "0.3.68"

# Unicode
unicode-normalization = "0.1.23"
unicode-bidi = "0.3.15"

# Cryptography
sha2 = "0.10.8"
blake3 = "1.5.3"
hmac = "0.12.1"
hex = "0.4.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization

[profile.wasm]
inherits = "release"
opt-level = 3       # Aggressive optimization for WASM
