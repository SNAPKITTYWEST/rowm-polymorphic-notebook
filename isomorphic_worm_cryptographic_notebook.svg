<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Isomorphic Worm Cryptographic Notebook</title>
<desc id="desc">Animated sovereign notebook container with a glowing worm moving through pages, reversible Unicode streams, isomorphic mappings, and a rotating cryptographic stamp.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#050816"/>
    <stop offset=".5" stop-color="#0d1230"/>
    <stop offset="1" stop-color="#18092b"/>
  </linearGradient>

  <radialGradient id="core">
    <stop stop-color="#f8fcff"/>
    <stop offset=".2" stop-color="#7ef9ff"/>
    <stop offset=".55" stop-color="#7458ff"/>
    <stop offset="1" stop-color="#120b34" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="wormG" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#60faff"/>
    <stop offset=".5" stop-color="#ffd86b"/>
    <stop offset="1" stop-color="#ff4fd8"/>
  </linearGradient>

  <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#eef9ff"/>
    <stop offset="1" stop-color="#b4c2e5"/>
  </linearGradient>

  <linearGradient id="sealG">
    <stop stop-color="#ffe98a"/>
    <stop offset=".5" stop-color="#c89521"/>
    <stop offset="1" stop-color="#fff1a3"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/>
  </filter>

  <clipPath id="chamberClip">
    <rect x="110" y="100" width="1380" height="790" rx="70"/>
  </clipPath>

  <path id="wormPath" d="M250 710 C 380 610, 420 380, 590 420 S 810 690, 960 555 S 1210 300, 1380 435"/>
  <path id="unicodePath" d="M220 230 C 450 120, 670 300, 825 190 S 1190 120, 1400 255"/>
  <path id="unicodePath2" d="M1380 770 C 1110 900, 940 695, 760 820 S 430 920, 230 755"/>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

<g opacity=".4">
  <circle cx="180" cy="170" r="100" fill="#4fdfff" filter="url(#soft)">
    <animate attributeName="opacity" values=".2;.55;.2" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1430" cy="760" r="150" fill="#d84fff" filter="url(#soft)">
    <animate attributeName="opacity" values=".18;.5;.18" dur="6.4s" repeatCount="indefinite"/>
  </circle>
</g>

<rect x="80" y="70" width="1440" height="850" rx="90" fill="#070b1e" stroke="#6ef7ff" stroke-width="4" filter="url(#shadow)"/>

<rect x="96" y="86" width="1408" height="818" rx="78" fill="none" stroke="#c56bff" stroke-width="2" stroke-dasharray="10 12">
  <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" repeatCount="indefinite"/>
</rect>

<rect x="110" y="100" width="1380" height="790" rx="70" fill="url(#bg)" stroke="#263b6f" stroke-width="2"/>

<g clip-path="url(#chamberClip)">

  <g opacity=".16" stroke="#7ef9ff" stroke-width="1">
    <path d="M100 180H1500M100 270H1500M100 360H1500M100 450H1500M100 540H1500M100 630H1500M100 720H1500M100 810H1500"/>
    <path d="M210 90V900M350 90V900M490 90V900M630 90V900M770 90V900M910 90V900M1050 90V900M1190 90V900M1330 90V900"/>
  </g>

  <text font-family="monospace" font-size="28" fill="#7ef9ff" opacity=".8">
    <textPath href="#unicodePath" startOffset="0%">
      ⟲ λ ↔ Ω ∴ ∷ ⊕ ϕ ∑ ⧉ ⟡ ⌁ ⊗ 𐤀 ꙮ ⌬ ∞ ↶ ⇄ ⟁ ⌘ ⦿
    </textPath>
    <animate attributeName="opacity" values=".35;1;.35" dur="3.8s" repeatCount="indefinite"/>
  </text>

  <circle r="5" fill="#fff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite">
      <mpath href="#unicodePath"/>
    </animateMotion>
  </circle>

  <text font-family="monospace" font-size="25" fill="#ff79dc" opacity=".75">
    <textPath href="#unicodePath2" startOffset="0%">
      ⦿ ⌘ ⟁ ⇄ ↶ ∞ ⌬ ꙮ 𐤀 ⊗ ⌁ ⟡ ⧉ ∑ ϕ ⊕ ∷ ∴ Ω ↔ λ ⟲
    </textPath>
    <animate attributeName="opacity" values=".9;.3;.9" dur="4.4s" repeatCount="indefinite"/>
  </text>

  <g transform="translate(300 280)" filter="url(#shadow)">
    <ellipse cx="500" cy="500" rx="470" ry="55" fill="#000" opacity=".45"/>

    <path d="M40 80 Q250 15 500 105 Q750 15 960 80 L930 515 Q720 445 500 535 Q280 445 70 515Z"
          fill="#121a3f"
          stroke="#7ef9ff"
          stroke-width="4"/>

    <path d="M70 95 Q270 40 490 120 L480 500 Q280 425 90 485Z"
          fill="url(#pageG)"
          stroke="#d9e9ff"
          stroke-width="2">
      <animate
        attributeName="d"
        dur="6s"
        repeatCount="indefinite"
        values="
          M70 95 Q270 40 490 120 L480 500 Q280 425 90 485Z;
          M70 95 Q260 58 500 115 L480 500 Q290 440 90 485Z;
          M70 95 Q270 40 490 120 L480 500 Q280 425 90 485Z
        "/>
    </path>

    <path d="M510 120 Q730 40 930 95 L910 485 Q720 425 520 500Z"
          fill="url(#pageG)"
          stroke="#d9e9ff"
          stroke-width="2">
      <animate
        attributeName="d"
        dur="5.2s"
        repeatCount="indefinite"
        values="
          M510 120 Q730 40 930 95 L910 485 Q720 425 520 500Z;
          M500 115 Q740 58 930 95 L910 485 Q710 440 520 500Z;
          M510 120 Q730 40 930 95 L910 485 Q720 425 520 500Z
        "/>
    </path>

    <path d="M500 105V535" stroke="#ffd86b" stroke-width="9" opacity=".9"/>

    <g font-family="monospace" fill="#172044" opacity=".82">
      <text x="135" y="180" font-size="27">f : A ⇄ B : f⁻¹</text>
      <text x="135" y="230" font-size="23">f⁻¹(f(x)) = canon(x)</text>
      <text x="135" y="280" font-size="23">meaning(x) ≡ meaning(f(x))</text>
      <text x="135" y="340" font-size="22">ROWM ⟺ WORM</text>
      <text x="135" y="390" font-size="20">WRITE ONCE · READ MANY</text>

      <text x="575" y="180" font-size="24">⟦ λ Ω ϕ ∑ ⟧ ↔ ⟦ 𐤀 ꙮ ⌬ ⟧</text>
      <text x="575" y="235" font-size="21">SHA-512 : FULL DIGEST</text>
      <text x="575" y="285" font-size="21">Ed25519 : PUBLIC VERIFY</text>
      <text x="575" y="335" font-size="21">MERKLE(ROOT(PAGES))</text>
      <text x="575" y="385" font-size="19">PROLOG ⟺ DATALOG ⟺ RUNTIME</text>
    </g>

    <g transform-origin="500px 110px">
      <path d="M500 110 Q690 25 920 90 L900 470 Q720 410 510 495Z"
            fill="#eaf5ff"
            opacity=".42"
            stroke="#7ef9ff"
            stroke-width="2"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 500 110;-16 500 110;0 500 110"
        dur="7s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(305 505)" filter="url(#glow)">
    <circle r="86" fill="none" stroke="#7ef9ff" stroke-width="8" stroke-dasharray="18 9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle r="58" fill="url(#core)" opacity=".75">
      <animate attributeName="r" values="52;65;52" dur="3s" repeatCount="indefinite"/>
    </circle>

    <text text-anchor="middle" y="8" fill="#fff" font-size="27" font-family="monospace">A</text>
  </g>

  <g transform="translate(1295 435)" filter="url(#glow)">
    <circle r="86" fill="none" stroke="#ff68dc" stroke-width="8" stroke-dasharray="12 12">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>

    <circle r="58" fill="url(#core)" opacity=".75">
      <animate attributeName="r" values="65;52;65" dur="3s" repeatCount="indefinite"/>
    </circle>

    <text text-anchor="middle" y="8" fill="#fff" font-size="27" font-family="monospace">B</text>
  </g>

  <use href="#wormPath" fill="none" stroke="#15244f" stroke-width="34" stroke-linecap="round"/>

  <use href="#wormPath"
       fill="none"
       stroke="url(#wormG)"
       stroke-width="7"
       stroke-linecap="round"
       stroke-dasharray="22 18"
       filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="2.4s" repeatCount="indefinite"/>
  </use>

  <g filter="url(#glow)">
    <g id="worm">
      <ellipse cx="0" cy="0" rx="42" ry="25" fill="url(#wormG)"/>
      <circle cx="18" cy="-7" r="4" fill="#06101f"/>
      <circle cx="18" cy="7" r="4" fill="#06101f"/>

      <path d="M-36 0 C-60 -22 -75 20 -98 0 C-122 -20 -138 18 -160 0"
            fill="none"
            stroke="url(#wormG)"
            stroke-width="25"
            stroke-linecap="round"/>

      <path d="M26 -16 Q48 -30 58 -15M26 16 Q48 30 58 15"
            fill="none"
            stroke="#ffd86b"
            stroke-width="4"/>
    </g>

    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wormPath"/>
    </animateMotion>
  </g>

  <g fill="#fff" filter="url(#glow)">
    <circle r="4">
      <animateMotion dur="10s" begin="-1.2s" repeatCount="indefinite">
        <mpath href="#wormPath"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion dur="10s" begin="-2.4s" repeatCount="indefinite">
        <mpath href="#wormPath"/>
      </animateMotion>
    </circle>

    <circle r="5">
      <animateMotion dur="10s" begin="-3.6s" repeatCount="indefinite">
        <mpath href="#wormPath"/>
      </animateMotion>
    </circle>
  </g>

  <g transform="translate(1230 680)" filter="url(#glow)">
    <circle r="128" fill="#0b1231" stroke="url(#sealG)" stroke-width="10"/>

    <circle r="106" fill="none" stroke="#ffd86b" stroke-width="2" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>

    <circle r="82" fill="none" stroke="#7ef9ff" stroke-width="3" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <text x="0" y="-15" text-anchor="middle" fill="#ffe98a" font-size="54" font-family="serif">Ω</text>
    <text x="0" y="23" text-anchor="middle" fill="#fff" font-size="15" font-family="monospace">CRYPTOGRAPHICALLY</text>
    <text x="0" y="45" text-anchor="middle" fill="#fff" font-size="18" font-family="monospace">STAMPED</text>
    <text x="0" y="83" text-anchor="middle" fill="#7ef9ff" font-size="12" font-family="monospace">ED25519 · SHA-512 · MERKLE</text>

    <animateTransform
      attributeName="transform"
      additive="sum"
      type="scale"
      values="1;1.04;1"
      dur="3.2s"
      repeatCount="indefinite"/>
  </g>

  <rect x="130" y="140" width="1340" height="4" fill="#7ef9ff" opacity=".65" filter="url(#glow)">
    <animate attributeName="y" values="140;850;140" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="140" y="58" fill="#d9faff" font-family="monospace" font-size="26" letter-spacing="5">
  ISOMORPHIC SHIFT // WORM CONTAINER
</text>

<text x="1450" y="58" text-anchor="end" fill="#ffd86b" font-family="monospace" font-size="18">
  REVERSIBLE · UNICODED · SEALED
</text>

<g font-family="monospace">
  <rect x="120" y="890" width="1360" height="56" rx="18" fill="#0b1230" stroke="#314b85"/>
  <text x="150" y="925" fill="#7ef9ff" font-size="18">WORM ⇄ ROWM</text>
  <text x="380" y="925" fill="#fff" font-size="18">WRITE ONCE · READ MANY</text>
  <text x="760" y="925" fill="#ff79dc" font-size="18">f⁻¹(f(x)) = canonical(x)</text>
  <text x="1190" y="925" fill="#ffd86b" font-size="18">EVIDENCE OR SILENCE</text>
</g>
</svg>
